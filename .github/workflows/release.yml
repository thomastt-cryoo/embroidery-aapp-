name: Private M2 desktop build
# Manual only: no tags, Releases, Pages, or public publishing.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-m2-macos
  cancel-in-progress: false
jobs:
  macos:
    name: macOS universal build and actual runner checks
    runs-on: macos-14
    timeout-minutes: 80
    env:
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure pinned font cache
        run: echo "LILO_FONTS_CACHE=$RUNNER_TEMP/studio-fonts-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: studio-m2-macos
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned font assets
        id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-fonts-cache
          key: studio-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
      - name: Prepare evidence
        run: mkdir -p out/evidence
      - name: Verify version and packaging boundaries
        run: |
          pnpm check-versions | tee out/evidence/versions.txt
          pnpm guide:check | tee out/evidence/guide.txt
          node scripts/m2-package-check.mjs | tee out/evidence/isolation.txt
      - name: Build complete universal Mac app and compare delivery formats
        run: |
          set -o pipefail
          # Earlier complete comparisons proved raw assets + native LZMA PKG
          # smallest. Reuse that setting when verifying the graphics repair.
          for mode in raw; do
            EXTRA=()
            if [ "$mode" = compressed ]; then EXTRA=(--features asset-compression); fi
            pnpm tauri build --target universal-apple-darwin --bundles app "${EXTRA[@]}" 2>&1 | tee "out/evidence/macos-build-$mode.txt"
            cp reports/M2/etsy/asset-preservation.json "out/evidence/assets-$mode.json"
            python scripts/m2-macos-etsy.py package --app "app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Embroidery Studio.app" --mode "$mode"
          done
      - name: Native Rust regression checks on macOS
        run: |
          set -o pipefail
          EXTRA=()
          MODE=$(python -c 'import json;print(json.load(open("out/evidence/mac-selected-package.json"))["mode"])')
          if [ "$MODE" = compressed ]; then EXTRA=(--features asset-compression); fi
          cargo test --release --manifest-path app/src-tauri/Cargo.toml --lib "${EXTRA[@]}" 2>&1 | tee out/evidence/native-tests.txt
      - name: Extract actual customer ZIP, install and launch on macOS
        run: |
          set -euo pipefail
          python scripts/m2-macos-etsy.py install
      - name: Verify visible stitches, simulation and native file dialogs from actual ZIP
        env:
          M2_MAC_DELIVERY_DIR: out
        run: python scripts/m2-macos-native-ui.py
      - name: Real conversion, editing, projects and all exports on macOS browser
        run: |
          set -euo pipefail
          pnpm --filter editor exec playwright-core install chromium
          export LILO_CHROMIUM=$(node --input-type=commonjs -e 'const {createRequire}=require("module");console.log(createRequire(process.cwd()+"/editor/package.json")("playwright-core").chromium.executablePath())')
          python3 -m http.server 4173 --bind 127.0.0.1 --directory editor/dist > out/evidence/server.txt 2>&1 &
          export LILO_PRODUCTION=1 LILO_URL=http://127.0.0.1:4173
          node scripts/m2-ui-check.mjs | tee out/evidence/browser-acceptance.txt
          cp -R reports/M2/evidence/acceptance out/evidence/
      - name: Collect customer packages and manifest
        if: always()
        run: |
          set -euo pipefail
          shasum -a 256 out/*.zip > out/SHA256SUMS.txt 2>/dev/null || true
          du -h out/* || true
          echo 'Build/launch evidence is distinct from browser conversion checks. Ad-hoc signed; not Developer ID or notarized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embroidery-Studio-macOS-M2-Etsy-private
          path: out/
          retention-days: 2
          if-no-files-found: error
