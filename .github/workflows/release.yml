name: Private M2 desktop build
# Manual only: no tags, Releases, Pages, or public publishing.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-m2-macos
  cancel-in-progress: false
jobs:
  macos:
    name: macOS universal build and actual runner checks
    runs-on: macos-14
    timeout-minutes: 80
    env:
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure pinned font cache
        run: echo "LILO_FONTS_CACHE=$RUNNER_TEMP/studio-fonts-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: studio-m2-macos
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned font assets
        id: fonts-pin
        run: echo "commit=$(node --experimental-strip-types scripts/import-fonts.mjs --print-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-fonts-cache
          key: studio-fonts-${{ steps.fonts-pin.outputs.commit }}
      - run: pnpm fonts
      - name: Prepare evidence
        run: mkdir -p out/evidence
      - name: Verify version and packaging boundaries
        run: |
          pnpm check-versions | tee out/evidence/versions.txt
          pnpm guide:check | tee out/evidence/guide.txt
          node scripts/m2-package-check.mjs | tee out/evidence/isolation.txt
      - name: Build universal application and DMG
        run: |
          set -o pipefail
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg 2>&1 | tee out/evidence/macos-build.txt
      - name: Native Rust regression checks on macOS
        run: |
          set -o pipefail
          cargo test --release --manifest-path app/src-tauri/Cargo.toml --lib 2>&1 | tee out/evidence/native-tests.txt
      - name: Install from DMG and launch on actual macOS
        run: |
          set -euo pipefail
          DMG=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          mkdir -p "$RUNNER_TEMP/studio-volume"
          hdiutil verify "$DMG" | tee out/evidence/dmg-verify.txt
          hdiutil attach "$DMG" -nobrowse -mountpoint "$RUNNER_TEMP/studio-volume"
          ditto "$RUNNER_TEMP/studio-volume/Embroidery Studio.app" "$RUNNER_TEMP/Embroidery Studio.app"
          hdiutil detach "$RUNNER_TEMP/studio-volume"
          python3 scripts/m2-macos-smoke.py "$RUNNER_TEMP/Embroidery Studio.app" out/evidence
      - name: Real conversion, editing, projects and all exports on macOS browser
        run: |
          set -euo pipefail
          pnpm --filter editor exec playwright-core install chromium
          export LILO_CHROMIUM=$(node --input-type=commonjs -e 'const {createRequire}=require("module");console.log(createRequire(process.cwd()+"/editor/package.json")("playwright-core").chromium.executablePath())')
          python3 -m http.server 4173 --bind 127.0.0.1 --directory editor/dist > out/evidence/server.txt 2>&1 &
          export LILO_PRODUCTION=1 LILO_URL=http://127.0.0.1:4173
          node scripts/m2-ui-check.mjs | tee out/evidence/browser-acceptance.txt
          cp -R reports/M2/evidence/acceptance out/evidence/
      - name: Collect customer packages and manifest
        if: always()
        run: |
          set -euo pipefail
          B=app/src-tauri/target/universal-apple-darwin/release/bundle
          if [ -d "$B/dmg" ]; then find "$B/dmg" -name '*.dmg' -exec cp {} out/ \;; fi
          if [ -d "$B/macos/Embroidery Studio.app" ]; then ditto -c -k --sequesterRsrc --keepParent "$B/macos/Embroidery Studio.app" out/Embroidery_Studio_1.4.0_universal.app.zip; fi
          cp LICENSE out/LICENSE.txt
          cp NOTICE.md out/NOTICE.txt
          cp reports/M2/MAC_REVIEW.md out/READ_ME_FIRST.md
          shasum -a 256 out/*.dmg out/*.zip > out/SHA256SUMS.txt 2>/dev/null || true
          du -h out/* || true
          echo 'Build/launch evidence is distinct from browser conversion checks. Ad-hoc signed; not Developer ID or notarized.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embroidery-Studio-macOS-M2-private
          path: out/
          retention-days: 2
          if-no-files-found: error
