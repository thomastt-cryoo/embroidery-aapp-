name: Private M2 customer ZIP verification
on:
  workflow_dispatch:
    inputs:
      runId:
        description: Successful private M2 build run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact private customer ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.runId }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)" = success
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Embroidery-Studio-macOS-M2-Etsy-private --dir received
      - name: Install actual ZIP and verify native project/PES rendering
        run: python3 scripts/m2-macos-zip-core.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-Etsy-native-ZIP-verification
          path: received/evidence/
          retention-days: 2
