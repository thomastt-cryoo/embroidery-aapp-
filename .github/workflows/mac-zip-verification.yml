name: Private M2 customer ZIP verification
on:
  workflow_dispatch:
    inputs:
      runId:
        description: Private M2 package run to verify without changing its ZIP
        required: true
        type: string
      artifactName:
        description: Private artifact containing the complete customer ZIP
        type: choice
        default: Embrova-macOS-M2-Etsy-private
        options:
          - Embrova-macOS-M2-Etsy-private
          - M2-Etsy-native-ZIP-verification
      runner:
        description: Standard macOS runner pool
        type: choice
        default: macos-14
        options:
          - macos-14
          - macos-15-intel
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - name: Download the exact private customer ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.runId }}
          SOURCE_ARTIFACT: ${{ inputs.artifactName }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .conclusion)
          if [ "$CONCLUSION" != success ]; then
            # A native UI driver failure does not require rebuilding a sealed
            # app. Only accept a completed installer-repair run whose actual
            # ZIP installation already passed, then repeat all native tests.
            test "$CONCLUSION" = failure
            SOURCE_WORKFLOW=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .path)
            case "$SOURCE_WORKFLOW" in
              .github/workflows/mac-package-repair.yml|.github/workflows/release.yml) ;;
              *) exit 1 ;;
            esac
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "Install the complete actual customer ZIP" or .name == "Extract actual customer ZIP, install and launch on macOS")][0].conclusion')" = success
          fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir received
      - name: Install actual ZIP and verify native project/PES rendering
        run: python3 scripts/m2-macos-zip-core.py
      - name: Test native macOS interface without changing the application
        timeout-minutes: 5
        run: python3 scripts/m2-macos-native-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-Etsy-native-ZIP-verification
          path: received/
          retention-days: 2
