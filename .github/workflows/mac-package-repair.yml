name: Private M2 Mac installer verification
on:
  workflow_dispatch:
    inputs:
      runId:
        description: Existing universal build whose sealed app must be preserved
        required: true
        default: '39326712145'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - name: Download private universal build and validate its provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.runId }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .path)" = .github/workflows/release.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/source-jobs.json"
          python - <<'PY'
          import json,os,pathlib
          jobs=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'source-jobs.json').read_text())['jobs']
          steps=[s for j in jobs for s in j['steps']]
          for name in ['Build complete universal Mac app and compare delivery formats','Native Rust regression checks on macOS']:
              assert any(s['name']==name and s['conclusion']=='success' for s in steps),name
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Embrova-macOS-M2-Etsy-private --dir source-package
      - name: Extract sealed application and rebuild installer metadata only
        run: |
          set -euo pipefail
          mkdir -p out/evidence/source-build
          cp -R source-package/evidence/. out/evidence/source-build/
          cp source-package/evidence/assets-raw.json out/evidence/assets-raw.json
          cp source-package/evidence/native-tests.txt out/evidence/native-tests.txt
          python - <<'PY'
          import os,pathlib,subprocess,zipfile
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-source'
          work.mkdir()
          with zipfile.ZipFile('source-package/Embrova-macOS.zip') as z:
              assert z.testzip() is None
              z.extract('Install Embrova.pkg',work)
          subprocess.run(['pkgutil','--expand-full',str(work/'Install Embrova.pkg'),str(work/'expanded')],check=True)
          app=next((work/'expanded').rglob('Embrova.app'))
          subprocess.run(['codesign','--verify','--deep','--strict','--all-architectures',str(app)],check=True)
          subprocess.run(['python','scripts/m2-macos-etsy.py','package','--app',str(app),'--mode','raw','--pkg-only'],check=True)
          PY
      - name: Install the complete actual customer ZIP
        run: python scripts/m2-macos-etsy.py install
      - name: Verify native stitch preview, editing, hoop, simulation, save and export
        env:
          M2_MAC_DELIVERY_DIR: out
        run: python scripts/m2-macos-native-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embrova-macOS-M2-Etsy-private
          path: out/
          retention-days: 2
          if-no-files-found: error
