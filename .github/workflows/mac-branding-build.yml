name: Embrova - Mac build and branding verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
      M2_BUILD_ONLY: '1'
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_BUILD_JOBS: '3'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      MAC_COMPRESSION_TUNING_SECONDS: '0'
      MAC_OWNER_ACCEPTED_SIZE_EXCEPTION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/Embrova/fonts
            app/src-tauri/target
          key: mac-universal-branding-intel-${{ hashFiles('app/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
      - name: Build complete universal ZIP with the owner-approved size exception
        run: bash scripts/codemagic-macos.sh
      - name: Verify installed branding package and capture actual Mac menu bar
        run: .codemagic-venv/bin/python scripts/github-macos-branding-check.py
      - name: Check project folder compatibility after rebranding
        run: cargo test --release --target x86_64-apple-darwin --manifest-path app/src-tauri/Cargo.toml --lib projects::tests
      - name: Native Embrova editing, saving, reopening and export checks
        env:
          M2_MAC_DELIVERY_DIR: out
          M3_SCREENSHOT_DIR: out/02-macOS/functional/originals
          VERIFY_PLAIN_HOME_CREDIT: '1'
        run: .codemagic-venv/bin/python scripts/m2-macos-native-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embrova-macOS-current
          path: |
            out/Embrova-macOS.zip
            out/MACOS_REBUILD_REPORT.md
            out/MACOS_BRANDING_REPORT.md
            out/SHA256SUMS.txt
            out/Mac-QA-evidence.zip
            out/evidence/
            out/02-macOS/
          retention-days: 2
