name: Mac ZIP - updated menu bar branding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
      M2_BUILD_ONLY: '1'
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_BUILD_JOBS: '3'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/EmbroideryStudio/fonts
            app/src-tauri/target
          key: mac-universal-branding-${{ hashFiles('app/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
      - name: Build complete universal ZIP and enforce Etsy size limit
        run: bash scripts/codemagic-macos.sh
      - name: Verify installed branding package and capture actual Mac menu bar
        run: .codemagic-venv/bin/python scripts/github-macos-branding-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embroidery-Studio-macOS-current
          path: |
            out/Embroidery-Studio-macOS.zip
            out/MACOS_REBUILD_REPORT.md
            out/MACOS_BRANDING_REPORT.md
            out/SHA256SUMS.txt
            out/Mac-QA-evidence.zip
            out/evidence/
          retention-days: 2
