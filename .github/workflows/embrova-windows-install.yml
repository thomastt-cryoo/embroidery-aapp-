name: Embrova - Windows package installation check
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 of the exact Embrova Windows customer ZIP
        required: true
        type: string
      exe_sha256:
        description: Expected installed executable checksum, including the final native icons
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact customer ZIP
        shell: pwsh
        env:
          EXPECTED_ZIP_SHA256: ${{ inputs.sha256 }}
        run: |
          if ($env:EXPECTED_ZIP_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid package checksum' }
          git fetch --depth=1 origin refs/heads/codex/embrova-verification-package
          if ($LASTEXITCODE -ne 0) { throw 'Package fetch failed' }
          python -c "import subprocess; from pathlib import Path; Path('Embrova-Windows.zip').write_bytes(subprocess.check_output(['git','show','FETCH_HEAD:Embrova-Windows.zip']))"
          if ((Get-FileHash -LiteralPath Embrova-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_ZIP_SHA256) { throw 'Wrong customer ZIP' }
          python -c "import zipfile; z=zipfile.ZipFile('Embrova-Windows.zip'); assert z.testzip() is None; assert sorted(z.namelist())==['Install Embrova.exe','LICENSE.txt','NOTICE.txt','START HERE.txt']; z.extractall('received')"
      - name: Install and launch actual Embrova customer package
        shell: pwsh
        env:
          EXPECTED_EXE_SHA256: ${{ inputs.exe_sha256 }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $installDir = Join-Path $env:RUNNER_TEMP 'Embrova-install-test'
          $installerPath = (Resolve-Path -LiteralPath 'received/Install Embrova.exe').Path
          $installation = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "Installer exited $($installation.ExitCode)" }
          $exe = Join-Path $installDir 'embrova.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Installed executable is missing' }
          if ($env:EXPECTED_EXE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid executable checksum' }
          $installedHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -ne $env:EXPECTED_EXE_SHA256) { throw 'Installed app does not match the verified rounded-icon executable' }
          $metadata = (Get-Item -LiteralPath $exe).VersionInfo
          if ($metadata.ProductName -ne 'Embrova') { throw 'Installed product name was not updated' }
          $app = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $title = ''
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited $($app.ExitCode)" }
              $title = $app.MainWindowTitle
              if ($title -like '*Embrova*') { break }
            }
            if ($title -notlike '*Embrova*') { throw 'No Embrova application window observed' }
            @{ result='pass'; installerExitCode=$installation.ExitCode; productName=$metadata.ProductName; windowTitle=$title; installedExecutableSha256=$installedHash; roundedIconExecutableMatched=$true; customerZipSha256=(Get-FileHash -LiteralPath Embrova-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant(); consumerSmartScreenTested=$false; securitySettingsChanged=$false; scope='Standard CI installation and launch; exact executable resource checksum checked; no clean consumer warning claim' } | ConvertTo-Json | Set-Content -LiteralPath out/windows-install-results.json
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Embrova-Windows-installation
          path: out/
          retention-days: 2
