name: Private M3 Mac installation screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download the unchanged private M2 customer ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          gh run download 39346926486 --repo "$GITHUB_REPOSITORY" --name M2-Etsy-native-ZIP-verification --dir "$RUNNER_TEMP/m3-source"
          shasum -a 256 "$RUNNER_TEMP/m3-source/Embroidery-Studio-macOS.zip"
      - name: Capture real macOS customer installation screens
        timeout-minutes: 8
        run: python3 scripts/m3-macos-capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M3-native-macOS-installation-private
          path: m3-capture/
          retention-days: 2
